# PR이 열리거나 머지/닫힘/업데이트될 때 Discord 채널로 "PR 본문까지" 담은 알림을 보냅니다.
# 사용 액션(가장 평가 좋은 Discord 알림 액션): https://github.com/sarisia/actions-status-discord
#
# ── 설정 (최초 1회) ───────────────────────────────────────────────
# 1) Discord: 서버 설정 → 연동 → 웹후크 → 새 웹후크 → 채널 선택 → URL 복사
# 2) GitHub: 이 레포 → Settings → Secrets and variables → Actions →
#    New repository secret → 이름 DISCORD_WEBHOOK, 값=복사한 URL
#    (CLI: gh secret set DISCORD_WEBHOOK --repo <owner>/<repo>)
# 시크릿이 없으면 아무 것도 보내지 않고 조용히 통과합니다.
# ──────────────────────────────────────────────────────────────────

name: Discord PR Notify

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, closed]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      # 상태별 제목/색과 PR 본문(길면 자름)을 준비합니다.
      # 주의: PR 제목·본문을 셸 스크립트에 직접 넣지 않고 env 변수로만 다뤄 인젝션을 막습니다.
      - name: Build message
        id: msg
        if: ${{ env.DISCORD_WEBHOOK != '' }}
        env:
          ACTION: ${{ github.event.action }}
          MERGED: ${{ github.event.pull_request.merged }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ "$MERGED" = "true" ]; then
            title="🟢 PR 머지됨"; color="0x57F287"
          elif [ "$ACTION" = "closed" ]; then
            title="🔴 PR 닫힘 (머지 안 됨)"; color="0xED4245"
          elif [ "$ACTION" = "opened" ] || [ "$ACTION" = "reopened" ] || [ "$ACTION" = "ready_for_review" ]; then
            title="🔵 새 PR"; color="0x5865F2"
          else
            title="🟡 PR 업데이트"; color="0xFEE75C"
          fi
          body="$BODY"
          if [ -z "$body" ]; then
            body="_(설명이 비어 있습니다)_"
          elif [ "${#body}" -gt 1400 ]; then
            body="${body:0:1400}

          … (본문이 길어 생략 — 전체는 PR에서 확인)"
          fi
          {
            echo "title=$title"
            echo "color=$color"
            echo "body<<__MD_EOF__"
            echo "$body"
            echo "__MD_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Notify Discord
        if: ${{ env.DISCORD_WEBHOOK != '' }}
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          noprefix: true
          nodetail: true
          nocontext: true
          username: GitHub PR Bot
          avatar_url: ${{ github.event.pull_request.user.avatar_url }}
          title: "${{ steps.msg.outputs.title }} · #${{ github.event.pull_request.number }}"
          url: ${{ github.event.pull_request.html_url }}
          color: "${{ steps.msg.outputs.color }}"
          description: |
            **${{ github.event.pull_request.title }}**
            `${{ github.event.pull_request.user.login }}`  ·  `${{ github.event.pull_request.head.ref }}` → `${{ github.event.pull_request.base.ref }}`

            ${{ steps.msg.outputs.body }}

            ───────────────
            🔗 [PR 보기](${{ github.event.pull_request.html_url }})  ·  📝 커밋 ${{ github.event.pull_request.commits }}  ·  ✨ +${{ github.event.pull_request.additions }} / -${{ github.event.pull_request.deletions }}  ·  📄 파일 ${{ github.event.pull_request.changed_files }}개
